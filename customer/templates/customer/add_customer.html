{% extends "base.html" %}
{% load static %}

{% block title %}Add New Customer - DealTrack{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/add_customer.css' %}">
{% endblock %}

{% block content %}
<div class="container-fluid px-0 max-w-4xl mx-auto">
    <!-- Header -->
    <div class="d-flex align-items-center mb-4">
        <a href="#" onclick="history.back(); return false"
            class="btn btn-link link-secondary text-decoration-none p-0 me-3 fs-5">
            <i class="bi bi-arrow-left"></i>
        </a>
        <div>
            <h4 class="mb-1 text-main fw-bold">Add New Customer</h4>
            <p class="text-muted text-muted-custom mb-0">Create a new customer profile and lead</p>
        </div>
    </div>

    <!-- Form -->
    <form method="post" action="{% url 'add_customer' %}" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- Basic Information Card -->
        <div class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body p-4 p-md-5">
                <div class="d-flex align-items-center mb-4">
                    <div class="bg-blue-light text-blue rounded p-2 me-3 d-flex align-items-center justify-content-center"
                        style="width: 32px; height: 32px;">
                        <i class="bi bi-person-fill"></i>
                    </div>
                    <h5 class="mb-0 fw-bold text-main">Basic Information</h5>
                </div>

                <div class="row g-4">
                    <div class="col-md-6">
                        <label for="name" class="form-label text-main fw-medium">First Name <span
                                class="text-danger">*</span></label>
                        <input type="text" name="first_name" id="name" class="form-control" placeholder="Enter first name"
                            required>
                    </div>
                    <div class="col-md-6">
                        <label for="last_name" class="form-label text-main fw-medium">Last Name <span
                                class="text-danger">*</span></label>
                        <input type="text" name="last_name" id="last_name" class="form-control"
                            placeholder="Enter last name">
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label text-main fw-medium">Email Address <span
                                class="text-danger">*</span></label>
                        <input type="email" name="email" id="email" class="form-control"
                            placeholder="customer@email.com">
                    </div>
                    <div class="col-md-6">
                        <label for="name" class="form-label text-main fw-medium">AAdhar Number <span
                                class="text-danger">*</span></label>
                        <input type="text" name="id_proof_number" id="name" class="form-control" placeholder="Enter first name"
                            required>
                    </div>
                    <div class="col-md-6">
                        <label for="phone" class="form-label text-main fw-medium">Phone Number <span
                                class="text-danger">*</span></label>
                        <input type="text" name="phone" id="phone" class="form-control" placeholder="(555) 123-4567"
                            required>
                    </div>
                    <div class="col-md-6">
                        <label for="dob" class="form-label text-main fw-medium">Date of Birth</label>
                        <div class="input-group">
                            <input type="date" name="dob" id="dob" class="form-control text-muted-custom"
                                placeholder="mm/dd/yyyy">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="contact_method" class="form-label text-main fw-medium">Preferred Contact
                            Method</label>
                        <select class="form-select text-muted-custom" id="contact_method" name="contact_method">
                            <option value="Email" selected>Email</option>
                            <option value="Phone">Phone</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="image" class="form-label text-main fw-medium">Profile Image</label>
                        <input type="file" name="image" id="image" class="form-control" accept="image/*">
                    </div>
                </div>
            </div>
        </div>

        <!-- Address Information Card -->
        <div class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body p-4 p-md-5">
                <div class="d-flex align-items-center mb-4">
                    <div class="bg-green-light text-green rounded p-2 me-3 d-flex align-items-center justify-content-center"
                        style="width: 32px; height: 32px;">
                        <i class="bi bi-geo-alt-fill"></i>
                    </div>
                    <h5 class="mb-0 fw-bold text-main">Address Information</h5>
                </div>

                <div class="row g-4">
                    <div class="col-12">
                        <label for="address" class="form-label text-main fw-medium">Street Address</label>
                        <input type="text" name="address" id="address" class="form-control"
                            placeholder="123 Main Street">
                    </div>
                    <div class="col-md-6">
                        <label for="city" class="form-label text-main fw-medium">City</label>
                        <input type="text" name="city" id="city" class="form-control" placeholder="Enter city">
                    </div>
                    <div class="col-md-6">
                        <label for="state" class="form-label text-main fw-medium">State/Province</label>
                        <input type="text" name="state" id="state" class="form-control" placeholder="Enter state">
                    </div>
                    <div class="col-md-6">
                        <label for="zip" class="form-label text-main fw-medium">ZIP/Postal Code</label>
                        <input type="text" name="zip" id="zip" class="form-control" placeholder="12345">
                    </div>
                    <div class="col-md-6">
                        <label for="country" class="form-label text-main fw-medium">Country</label>
                        <input type="text" name="country" id="country" class="form-control" placeholder="India">
                    </div>
                    <!-- Hidden field to ensure backend doesn't break if id_proof_number is expected -->
                    <input type="hidden" name="id_proof_number" value="N/A">
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-3 mt-4 mb-5">
            <a href="{% url 'customer' %}" class="btn bg-transparent text-main border fw-medium px-4 py-2">Cancel</a>
            <button type="submit" class="btn btn-primary fw-medium px-5 py-2">Save Customer</button>
        </div>
    </form>
</div>
{% endblock %}
