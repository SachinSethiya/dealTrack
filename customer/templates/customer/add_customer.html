{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Customer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>
    <div class="container mt-5">
        <h2 class="mb-4">Add New Customer</h2>

        <!-- Form -->
        <form method="post" action="{% url 'add_customer' %}">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="name" class="form-label">Customer Name</label>
                    <input type="text" name="name" id="name" class="form-control" placeholder="Full Name" required>
                </div>
                <div class="col-md-6">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="text" name="phone" id="phone" class="form-control" placeholder="Phone Number" required>
                </div>
                <div class="col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" name="email" id="email" class="form-control" placeholder="Email">
                </div>
                <div class="col-12">
                    <label for="address" class="form-label">Address</label>
                    <textarea name="address" id="address" rows="3" class="form-control" placeholder="Address"></textarea>
                </div>
                <div class="col-12">
                    <label for="id_proof_number" class="form-label">ID Proof Number</label>
                    <input type="text" name="id_proof_number" id="id_proof_number" class="form-control" placeholder="ID Proof Number" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-4">Add Customer</button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary mt-4 ms-2">Cancel / Back to Dashboard</a>
        </form>
    </div>

    <!-- Optional JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
