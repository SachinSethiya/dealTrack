{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DealTrack</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/showroom_login.css' %}">
</head>
<body>
    <!-- Theme Toggle Button -->
    <button id="theme-toggle" class="btn-theme-toggle">
        <i id="theme-icon" class="bi bi-moon"></i>
    </button>

    <div class="login-container">
        <div class="login-card glass-card">
            <div class="login-header text-center mb-4">
                <div class="brand d-flex align-items-center justify-content-center gap-2 mb-2">
                    <i class="bi bi-car-front fs-4 brand-icon"></i>
                    <h5 class="mb-0 fw-bold tracking-wide">DEALTRACK</h5>
                </div>
                <h5 class="fw-normal mt-3">Account Login</h5>
            </div>

            <!-- Messages -->
            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-danger custom-alert small p-2 text-center">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}

            <!-- LOGIN FORM -->
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small">Username</label>
                    <input type="text" name="username" class="form-control glass-input" placeholder="Enter Username" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small">Password</label>
                    <input type="password" name="password" class="form-control glass-input" placeholder="Enter Password" required>
                </div>
                <button type="submit" class="btn btn-login w-100 mb-3">
                    Login
                </button>
            </form>
            
            <div class="text-center mb-4">
                <a href="#" class="forgot-link small">Forgot Password?</a>
            </div>

            <!-- SIGN UP SECTION -->
            <div class="text-center signup-section small">
                <span class="text-muted-custom">Not a user?</span>
                <a href="{% url 'signup' %}" class="btn-signup ms-1">
                    Sign Up
                </a>
            </div>
        </div>
    </div>

    <!-- Theme JS -->
    <script src="{% static 'js/theme.js' %}"></script>
</body>
</html>
