{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Signup - DealTrack</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .signup-card {
            width: 450px;
            padding: 30px;
            border-radius: 10px;
            background: white;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        .signup-card img {
            width: 80px;
            display: block;
            margin: auto;
        }

        .signup-title {
            text-align: center;
            margin: 15px 0;
        }
    </style>

</head>

<body>
    <div class="signup-card">
        ```
        <img src="{% static 'img/logo.jpeg' %}">
        <h4 class="signup-title">Create Account</h4>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Showroom Name</label>
                <input type="text" name="showroom_name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Owner Name</label>
                <input type="text" name="owner_name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Phone Number</label>
                <input type="text" name="phone_number" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>State</label>
                <input type="text" name="state" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>City</label>
                <input type="text" name="city" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Address</label>
                <textarea name="address" class="form-control" required></textarea>
            </div>
            <div class="mb-3">
                <label>GST Number</label>
                <input type="text" name="gst_number" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Pincode</label>
                <input type="text" name="pincode" class="form-control">
            </div>
            <button class="btn btn-primary w-100">
                Sign Up
            </button>
        </form>
        <div class="text-center mt-3">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </div>
    </div>
</body>

</html>
