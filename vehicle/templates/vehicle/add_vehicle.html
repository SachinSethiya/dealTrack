{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add Vehicle | DealTrack</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/add_vehicle.css' %}">

</head>

<body>
    <div class="container">
        <div class="card">
            <h2><i class="bi bi-car-front"></i> Add New Vehicle</h2>
            <form method="POST" action="">
                {% csrf_token %}

                <div class="form-grid">
                    <!-- Company -->
                    <div class="form-group">
                        <label>Company</label>
                        <input type="text" name="company" placeholder="Toyota / Honda" required>
                    </div>

                    <!-- Model -->
                    <div class="form-group">
                        <label>Model Name</label>
                        <input type="text" name="model_name" placeholder="Fortuner / City" required>
                    </div>

                    <!-- Variant -->
                    <div class="form-group">
                        <label>Variant</label>
                        <input type="text" name="variant" placeholder="ZX / VX / Sport">
                    </div>

                    <!-- Year -->
                    <div class="form-group">
                        <label>Manufacturing Year</label>
                        <input type="number" name="manufacturing_year" placeholder="2024" required>
                    </div>

                    <!-- Fuel -->
                    <div class="form-group">
                        <label>Fuel Type</label>
                        <select name="fuel_type">
                            <option value="">Select</option>
                            <option value="Petrol">Petrol</option>
                            <option value="Diesel">Diesel</option>
                            <option value="Electric">Electric</option>
                            <option value="Hybrid">Hybrid</option>
                        </select>
                    </div>

                    <!-- Transmission -->
                    <div class="form-group">
                        <label>Transmission</label>
                        <select name="transmission">
                            <option value="">Select</option>
                            <option value="Manual">Manual</option>
                            <option value="Automatic">Automatic</option>
                        </select>
                    </div>

                    <!-- KM Driven -->
                    <div class="form-group">
                        <label>Kilometers Driven</label>
                        <input type="number" name="km_driven" placeholder="15000">
                    </div>

                    <!-- Registration -->
                    <div class="form-group">
                        <label>Registration Number</label>
                        <input type="text" name="registration_no" placeholder="MP09AB1234">
                    </div>

                    <!-- Chasis -->
                    <div class="form-group">
                        <label>Chasis Number</label>
                        <input type="text" name="chasis_no">
                    </div>

                    <!-- Color -->
                    <div class="form-group">
                        <label>Color</label>
                        <input type="text" name="color">
                    </div>

                    <!-- Price -->
                    <div class="form-group">
                        <label>Purchase Price</label>
                        <input type="number" name="purchase_price" placeholder="1000000">
                    </div>

                    <!-- Date -->
                    <div class="form-group">
                        <label>Purchase Date</label>
                        <input type="date" name="purchase_date">
                    </div>

                    <!-- Status -->
                    <div class="form-group">
                        <label>Vehicle Status</label>
                        <select name="vehicle_status">
                            <option value="avail">Available</option>
                            <option value="sold">Sold</option>
                            <option value="reser">Reserved</option>
                        </select>
                    </div>

                    <!-- Buttons -->
                    <div class="buttons">
                        <button class="btn btn-add" type="submit">
                            <i class="bi bi-plus-circle"></i> Add Vehicle
                        </button>

                        <button class="btn btn-cancel" type="reset">
                            <i class="bi bi-x-circle"></i> Cancel
                        </button>
                    </div>

                </div>
            </form>
        </div>
    </div>

</body>

</html>
