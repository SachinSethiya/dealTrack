{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>{% block title %}DealTrack{% endblock %}</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_css %}{% endblock %}

</head>

<body>

    <div class="dashboard-layout">

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <img src="{% static 'img/logo.png' %}" class="logo-img">
                <a href="{% url 'dashboard' %}"><span class="logo-text">DealTrack</span></a>
            </div>
            <ul class="sidebar-menu">
                <li>
                    <a href="{% url 'dashboard' %}">
                        <i class="bi bi-house"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="{% url 'vehicle' %}">
                        <i class="bi bi-car-front"></i>
                        <span>Vehicles</span>
                    </a>
                </li>
                <li>
                    <a href="{% url 'deal' %}">
                        <i class="bi bi-cash-stack"></i>
                        <span>Deals</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <i class="bi bi-bar-chart"></i>
                        <span>Reports</span>
                    </a>
                </li>
                <li>
                    <a href="{% url 'customer' %}">
                        <i class="bi bi-people"></i>
                        <span>Customers</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <i class="bi bi-gear"></i>
                        <span>Settings</span>
                    </a>
                </li>
                <li class="logout">
                    <a href="{% url 'logout' %}">
                        <i class="bi bi-box-arrow-right"></i>
                        <span>Logout</span>
                    </a>
                </li>
            </ul>
        </div>


        <!-- Main Content -->
        <div class="main-content">

            <!-- Topbar -->
            <div class="topbar">

                <input type="text" class="form-control search" placeholder="Search here...">

                <div class="topbar-right">

                    <i class="bi bi-bell notification"></i>

                    <div class="admin-profile">

                        <span>Admin</span>

                        <img src="https://i.pravatar.cc/40" class="admin-img">

                    </div>

                </div>

            </div>


            <!-- Page Content -->
            <div class="page-content">

                {% block content %}
                {% endblock %}

            </div>

        </div>

    </div>

</body>

</html>
