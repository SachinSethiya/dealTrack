{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}CarShowroom{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/showroom_dashboard.css' %}">
</head>

<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <div class="sidebar">
            <a href="{% url 'dashboard' %}" class="navbar-brand me-4">
                <img src="{% static 'img/logo.png'%}" alt="logo" style="height: 50px; border-radius: 20px;">dealTrack
            </a>
            <ul class="menu">
                <li>
                    <a href="{% url 'dashboard' %}">
                        <i class="bi bi-house"></i> Home
                    </a>
                </li>
                <li>
                    <a href="{% url 'vehicle' %}">
                        <i class="bi bi-car-front"></i> Vehicles
                    </a>
                </li>
                <li>
                    <a href="{% url 'deal' %}">
                        <i class="bi bi-cash-stack"></i> Deals
                    </a>
                </li>
                <li>
                    <a href="{% url 'customer' %}">
                        <i class="bi bi-people-fill"></i> Customer
                    </a>
                </li>
                <!-- Logout Button -->
                <li class="mt-5">
                    <a href="{% url 'logout' %}" class="text-danger">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </a>
                </li>
            </ul>
        </div>


        <!-- Main content -->
        <div class="main">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>

</html>
