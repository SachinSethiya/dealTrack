{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Super Admin Login - DealTrack</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/super_admin_login.css' %}">
</head>

<body>
    <!-- Theme Toggle Icon Button -->
    <div class="login-theme-toggle">
        <button id="theme-toggle" class="btn btn-light border">
            <i id="theme-icon" class="bi bi-moon"></i>
        </button>
    </div>

    <div class="login-card">
        <div class="logo">
            <img src="{% static 'img/logo.png' %}" alt="DealTrack Logo">
        </div>
        <h3 class="login-title">Super Admin Login</h3>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" name="username" placeholder="Enter username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-login mt-2">Login</button>

            {% if error %}
            <div class="error-msg">
                {{ error }}
            </div>
            {% endif %}

        </form>

    </div>

    <!-- Theme toggling script -->
    <script src="{% static 'js/theme.js' %}"></script>
</body>

</html>
